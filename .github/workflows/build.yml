name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Java (needed by Android's build tool, Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          go get -tool golang.org/x/mobile/cmd/gobind
          gomobile init

      - name: Build bridge.aar from the Go code
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p android-app/app/libs
          gomobile bind -target=android -androidapi 24 \
            -javapkg=com.ledger.bridge \
            -o android-app/app/libs/bridge.aar \
            ./mobile/bridge

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        id: gradle_build
        working-directory: android-app
        continue-on-error: true
        run: gradle assembleDebug --stacktrace 2>&1 | tee /tmp/gradle_log.txt

      # GitHub's raw build-log storage isn't reachable from every network,
      # so on failure this posts the real error text to a GitHub issue,
      # which IS reachable via the normal API — this makes the actual
      # error readable/fixable from anywhere, not just this web UI.
      - name: Post error details to an issue (only runs if the build failed)
        if: steps.gradle_build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 30000 /tmp/gradle_log.txt > /tmp/gradle_tail.txt
          jq -Rs --arg title "build-log run ${{ github.run_id }}" \
            '{title: $title, body: ("```\n" + . + "\n```")}' \
            /tmp/gradle_tail.txt > /tmp/issue_payload.json
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d @/tmp/issue_payload.json

      - name: Fail the job if the build actually failed
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: Upload the APK
        if: steps.gradle_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PersonalPortfolio-test-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
